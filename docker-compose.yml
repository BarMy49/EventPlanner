services:
  backend:
    build:
      context: ./backend
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-this-secret}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      DATA_FILE: /data/data.json
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${DOMAIN:?DOMAIN is required},http://localhost,http://127.0.0.1}
    volumes:
      - backend-data:/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    depends_on:
      - backend
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:?LETSENCRYPT_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/etc/letsencrypt
    restart: unless-stopped

volumes:
  backend-data:
  letsencrypt:
